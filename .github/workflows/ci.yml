name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: unit and numerical regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: fast suite (mathematical identities, BP/EM correctness, theory checks)
        run: OMP_NUM_THREADS=2 python -m pytest -q -p no:cacheprovider -m "not slow"
               tests/test_bp_minimal.py tests/test_bp_mixture.py tests/test_em_bp.py tests/test_fisher_bruteforce.py
               tests/test_gaussian_bp_equivalence.py tests/test_gaussian_precision_score.py
               tests/test_message_normalization.py tests/test_recursion_agreement.py
               tests/test_score_mean_error_identity.py tests/test_shape_kernel.py tests/test_stationary.py
               tests/test_protocols.py tests/test_frozen_config_is_read.py
      - name: theory regression tests (Hermite attenuation, oracle ladder)
        run: OMP_NUM_THREADS=2 python -m pytest -q -p no:cacheprovider tests/test_theory_hermite.py tests/test_oracles.py

  evidence:
    name: every frozen output matches its registry hash and is tracked
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: python tools/freeze.py --check
      - run: python tools/registry.py --check

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markov-score"
version = "0.1.0"
description = "Exact scores, transition learning and information decay for Markov-chain data under diffusion noise"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary — private research repository; see LICENSE-NOTE.md"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "ruff>=0.5", "nbformat>=5.9"]
nn = ["torch>=2.3"]
gpu = ["cupy-cuda12x<14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end fits that take minutes, not seconds"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
